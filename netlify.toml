[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Ảnh thẻ hồ sơ: thư viện vẽ ảnh (wasm) + font + ảnh nền
  external_node_modules = ["satori", "@resvg/resvg-wasm"]
  included_files = ["netlify/assets/**"]

# API thân thiện: /api/<tên function>
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Hồ sơ người chơi: kèm thẻ meta riêng để chia sẻ link có ảnh
[[redirects]]
  from = "/player/*"
  to = "/.netlify/functions/player-page"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
