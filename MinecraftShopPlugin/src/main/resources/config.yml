# ============================================
#  BUILDNCHILL SHOP v2 - CONFIG
#  Tự động giao vật phẩm mua trên website vào game
# ============================================

bridge:
  # Địa chỉ Netlify plugin bridge của website
  url: "https://buildnchill.id.vn/api/plugin-bridge"

  # Khóa bí mật - PHẢI TRÙNG với biến môi trường PLUGIN_SECRET trên Netlify
  # (Netlify > Project configuration > Environment variables)
  # Không chia sẻ khóa này cho ai khác.
  secret: "DOI_THANH_PLUGIN_SECRET"

poll:
  # Bao nhiêu giây kiểm tra đơn hàng mới một lần (tối thiểu 3, khuyến nghị 10)
  interval_seconds: 10

notify:
  # Tiền tố cho tin nhắn lệnh /bncshop
  prefix: "&8[&6BnC-Shop&8] "

  # Tin nhắn chat gửi cho người chơi khi nhận hàng thành công
  # Biến: {product} = tên sản phẩm, {player} = tên người chơi. Hỗ trợ mã màu &
  chat:
    enabled: true
    messages:
      - "&8&m------------------------------"
      - "&6&l✦ BnC-Shop &8» &aĐã giao thành công: &e{product}"
      - "&7Cảm ơn &f{player} &7đã ủng hộ máy chủ BuildnChill! &c❤"
      - "&8&m------------------------------"

  # Tiêu đề hiện giữa màn hình
  title:
    enabled: true
    title: "&6&lCẢM ƠN BẠN!"
    subtitle: "&fĐã nhận &e{product}"

  # Âm thanh khi nhận hàng (tên theo org.bukkit.Sound)
  sound:
    enabled: true
    name: "ENTITY_PLAYER_LEVELUP"
